name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # no npm install: this package has zero dependencies and no lockfile
      - name: syntax
        run: node --check cli.mjs server.mjs lib/inject.mjs lib/paths.mjs lib/suggest.mjs lib/follow-log.mjs lib/pid.mjs lib/headers.mjs lib/proxy.mjs lib/console-api.mjs lib/doctor.mjs

      - name: unit
        run: npm test

      - name: cli help
        run: node cli.mjs help
